name: terraform-plan

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      branch: { description: Git branch to execute, required: true, type: string, default: main }
      environment: { description: Deployment environment, required: true, type: choice, options: [dev, prod] }
      region: { description: Azure Region, required: true, type: string, default: eastus }
      subscription_id: { description: Azure subscription id, required: true, type: string }
      terraform_version: { description: Terraform version, required: true, type: string, default: 1.8.5 }
  workflow_call:
    inputs:
      branch: { required: true, type: string }
      environment: { required: true, type: string }
      region: { required: true, type: string }
      subscription_id: { required: true, type: string }
      terraform_version: { required: true, type: string }
    secrets:
      AZURE_CLIENT_ID: { required: true }
      AZURE_TENANT_ID: { required: true }

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.event.inputs.branch || github.ref_name }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version || github.event.inputs.terraform_version || '1.8.5' }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id || github.event.inputs.subscription_id }}
      - name: Terraform init
        run: terraform init
      - name: Terraform plan (binary)
        run: terraform plan -var="region=${{ inputs.region || github.event.inputs.region || 'eastus' }}" -out=tfplan
      - name: Terraform show (human readable)
        run: terraform show -no-color tfplan > tfplan.txt
      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            tfplan
            tfplan.txt
      - name: PR plan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('tfplan.txt', 'utf8').slice(0, 65000);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan (${context.sha.substring(0,7)})\n\n\
              \
              \
              ${summary.substring(0, 60000)}\n\n(Truncated if very large)`
            });
