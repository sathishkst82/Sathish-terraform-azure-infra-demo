name: terraform-plan
on: { pull_request: {} }
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: { client-id: ${{ secrets.AZURE_CLIENT_ID }}, tenant-id: ${{ secrets.AZURE_TENANT_ID }}, subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} }
      - uses: hashicorp/setup-terraform@v3
      - run: cd environments/dev && terraform init && terraform plan -out=tfplan | tee plan.txt
      - uses: actions/upload-artifact@v4
        with: { name: dev-tfplan, path: environments/dev/tfplan }
      - uses: marocchino/sticky-pull-request-comment@v2
        with: { path: environments/dev/plan.txt }
