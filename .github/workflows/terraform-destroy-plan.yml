name: terraform-destroy-plan
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      branch:
        type: string
        required: true
      terraform_version:
        type: string
        required: true
      tf_lock_id:
        type: string
        required: false
      tf_import_id:
        type: string
        required: false
      tf_import_name:
        type: string
        required: false
      tf_remove_name:
        type: string
        required: false
      tf_use_extra_args:
        type: boolean
        required: false
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      TF_BACKEND_RESOURCE_GROUP:
        required: true
      TF_BACKEND_STORAGE_ACCOUNT:
        required: true
      TF_BACKEND_CONTAINER:
        required: true
      TF_BACKEND_KEY:
        required: true
      WIZ_CLIENT_ID:
        required: false
      WIZ_CLIENT_SECRET:
        required: false
      EXTRA_ARGS:
        required: false
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Resolve env folder
        id: env
        run: |
          echo "dir=$(echo '${{ inputs.environment }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        run: terraform -chdir=environments/${{ steps.env.outputs.dir }} init -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"
      - name: Optional state unlock
        if: ${{ inputs.tf_lock_id != '' }}
        run: terraform -chdir=environments/${{ steps.env.outputs.dir }} force-unlock -force "${{ inputs.tf_lock_id }}"
      - name: Optional import
        if: ${{ inputs.tf_import_id != '' && inputs.tf_import_name != '' }}
        run: terraform -chdir=environments/${{ steps.env.outputs.dir }} import "${{ inputs.tf_import_name }}" "${{ inputs.tf_import_id }}"
      - name: Optional state rm
        if: ${{ inputs.tf_remove_name != '' }}
        run: terraform -chdir=environments/${{ steps.env.outputs.dir }} state rm "${{ inputs.tf_remove_name }}"
      - run: terraform -chdir=environments/${{ steps.env.outputs.dir }} plan -destroy -out=tfdestroyplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfdestroyplan-${{ inputs.environment }}-${{ github.run_id }}
          path: environments/${{ steps.env.outputs.dir }}/tfdestroyplan
